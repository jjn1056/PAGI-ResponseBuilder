name    = PAGI-ResponseBuilder
author  = John Napiorkowski <jjnapiork@cpan.org>
license = Artistic_2_0
copyright_holder = John Napiorkowski
copyright_year   = 2026
abstract = Staged response builder for PAGI-Tools response values
version = 0.001000

[@Basic]
[MetaJSON]

; Render the GitHub README at the repository root.
[ReadmeAnyFromPod / ReadmeMarkdownInRoot]
type = markdown
filename = README.md
location = root

; Ship the same generated README in the CPAN distribution.
[ReadmeAnyFromPod / ReadmeMarkdownInBuild]
type = markdown
filename = README.md
location = build

[PkgVersion]

[MetaResources]
homepage = https://github.com/jjn1056/PAGI-ResponseBuilder
bugtracker.web  = https://github.com/jjn1056/PAGI-ResponseBuilder/issues
repository.web  = https://github.com/jjn1056/PAGI-ResponseBuilder
repository.url  = https://github.com/jjn1056/PAGI-ResponseBuilder.git
repository.type = git

[Prereqs::FromCPANfile]

; Development-only / unshippable files
[PruneFiles]
filename = CLAUDE.md
match = \.DS_Store
match = ^docs/
match = ^local/
match = \.log$
